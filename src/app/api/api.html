<!-- {{allemps | json}} -->

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
  Add Emp
</button>

<table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Name</th>
      <th scope="col">Salary</th>
      <th scope="col">Reporting Manager</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let e of allemps">
      <th scope="row">{{e.eid}}</th>
      <td>{{e.ename}}</td>
      <td>{{e.esalary}}</td>
      <td>{{e.mname}}</td>
      <td>
        <input type="submit" value="Delete" class="btn btn-sm btn-danger" (click)="DelEmp(e.eid)">
        ||<input type="submit" value="Edit" class="btn btn-sm btn-success" (click)="EditEmp(e.eid)">
      </td>
    </tr>

  </tbody>
</table>



<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="emps" (ngSubmit)="SaveEmp(emps.value)">
            Name  <input type="text" formControlName="ename" class="form-control"><br>
            Salary<input type="text" formControlName="esalary" class="form-control"><br>
            Reporting Manager
            <select class="form-control"  formControlName="mid">
                <option  *ngFor="let m of allmanagers" [value]="m.mid">{{m.mname}}</option>
            </select><br>
            <input type="submit" class="btn btn-primary">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>







<!-- Edit Modal -->
<div class="modal fade" id="exampleModal2" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="emps" (ngSubmit)="UpdateEmp(emps.value)">
          ID  <input type="text" readonly formControlName="eid" class="form-control"><br>  
          Name  <input type="text" formControlName="ename" class="form-control"><br>
            Salary<input type="text" formControlName="esalary" class="form-control"><br>
            Reporting Manager
            <select class="form-control"  formControlName="mid">
                <option  *ngFor="let m of allmanagers" [value]="m.mid">{{m.mname}}</option>
            </select><br>
            <input type="submit" class="btn btn-primary">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
